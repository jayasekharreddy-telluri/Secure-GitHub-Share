# Application
spring.application.name=github-share-backend

# PostgreSQL Database (from environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# GitHub OAuth (from environment variables)
github.client.id=${GITHUB_CLIENT_ID}
github.client.secret=${GITHUB_CLIENT_SECRET}
github.redirect.uri=${GITHUB_REDIRECT_URI}

# Encryption (from environment variables)
app.encryption.secret=${APP_ENCRYPTION_SECRET}

# Viewer URL and Frontend redirect (from environment variables)
app.viewer.base-url=${APP_VIEWER_BASE_URL}
frontend.redirect.success=${FRONTEND_REDIRECT_SUCCESS}
