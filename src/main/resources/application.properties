spring.application.name=github-share-backend

# Database (use Render PostgreSQL connection string)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# GitHub OAuth
github.client.id=${GITHUB_CLIENT_ID}
github.client.secret=${GITHUB_CLIENT_SECRET}
github.redirect.uri=${GITHUB_REDIRECT_URI}

# Encryption
app.encryption.secret=${APP_ENCRYPTION_SECRET}

# Viewer URL
app.viewer.base-url=${APP_VIEWER_BASE_URL}

# Frontend Redirect
frontend.redirect.success=${FRONTEND_REDIRECT_SUCCESS}

# Server port
server.port=${PORT:8080}
